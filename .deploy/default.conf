server {
    listen 80;
    server_name valeria-portfolio.ru www.valeria-portfolio.ru;
	
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name valeria-portfolio.ru www.valeria-portfolio.ru;
     
    ssl_certificate /etc/letsencrypt/live/valeria-portfolio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/valeria-portfolio.ru/privkey.pem;

    client_max_body_size 256M;

    root /var/www/backend/public;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        root /var/www/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/backend/public;

        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
    }

    location = /sitemap.xml {
        root /var/www/frontend/dist;
        try_files $uri =404;
    }

    location = /robots.txt {
        root /var/www/frontend/dist;
        try_files $uri =404;
    }

    location / {
        root /var/www/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
}
