services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - ../backend:/var/www/backend
      - ../frontend/dist:/var/www/frontend/dist
    depends_on:
      - backend
      - db
    container_name: nginx
    networks:
      - network

  db:
    image: mysql:9.0
    container_name: mysql_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: portfolio_landing
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - network

  backend:
    build:
      context: ..
      dockerfile: .deploy/php.DockerFile
    volumes:
      - ../backend/php-custom.ini:/usr/local/etc/php/conf.d/custom.ini
    working_dir: /var/www/backend
    container_name: backend
    restart: unless-stopped
    networks:
      - network

  frontend:
    build:
      context: ..
      dockerfile: .deploy/vue.DockerFile
    container_name: frontend
    networks:
      - network

networks:
  network:

volumes:
  mysql_data:
