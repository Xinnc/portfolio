services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - ../backend/storage/app/public:/var/www/backend/storage/app/public
    depends_on:
      - backend
      - frontend
      - db
    container_name: nginx
    networks:
      - network

  db:
    image: mysql:9.0
    container_name: mysql_database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: portfolio_landing
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    networks:
      - network

  backend:
    build:
      context: ..
      dockerfile: .deploy/php.DockerFile
    volumes:
      - ../backend/php-custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - ../backend:/var/www/backend
    working_dir: /var/www/backend
    container_name: backend
    networks:
      - network

  frontend:
    build:
      context: ..
      dockerfile: .deploy/vue.DockerFile
    container_name: frontend
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
#    command: sh -c npm install pinia vue-router axios && npm install swiper
    networks:
      - network

networks:
  network:

volumes:
  mysql_data:
  frontend_node_modules: